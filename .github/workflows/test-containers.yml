name: Build GoLang Project

run-name: ${{ inputs.orchestrator_run_suffix && format('Build GoLang Project - {0}', inputs.orchestrator_run_suffix) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      orchestrator_run_suffix:
        description: Test orchestrator run suffix
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
      
    runs-on: ${{matrix.os}}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Buf CLI
        uses: bufbuild/buf-setup-action@v1.34.0
        with:
          github_token: ${{ github.token }}
      - run: buf --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      
      - name: Go Tidy
        run: go mod tidy
      
      - name: Install dependencies
        run: |
          go mod download
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2

      # Internal setup required by Specmatic. Sample project users can ignore this block.
      - if: ${{ inputs.orchestrator_run_suffix != '' }}
        uses: specmatic/specmatic-github-workflows/action-orchestrator-setup@main
        with:
          orchestrator-run-suffix: ${{ inputs.orchestrator_run_suffix }}
          docker-hub-username: ${{ vars.SPECMATIC_DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.SPECMATIC_DOCKER_HUB_TOKEN }}
      # End: internal setup required by Specmatic.

      - name: start dockerized tests
        run: go test contract_test.go -v -count=1

      - name: Upload CTRF Report
        uses: actions/upload-artifact@v6
        if: always() # Run even if tests fail
        with:
          name: ctrf-report
          path: build/reports/specmatic/grpc/ctrf/*.json
          retention-days: 5
    
      # Display CTRF test results
      - name: Publish Test Results
        uses: ctrf-io/github-test-reporter@v1
        if: always() # Run even if tests fail
        with:
          report-path: './build/reports/specmatic/grpc/ctrf/*.json'
